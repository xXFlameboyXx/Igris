services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: igris
      POSTGRES_USER: igris
      POSTGRES_PASSWORD: igris-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igris -d igris"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      IGRIS_ENVIRONMENT: development
      IGRIS_LOG_LEVEL: INFO
      IGRIS_METADATA_BACKEND: postgres
      IGRIS_DATABASE_URL: postgresql://igris:igris-dev-password@postgres:5432/igris
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
