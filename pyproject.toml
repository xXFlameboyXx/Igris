[project]
name = "igris"
version = "0.1.0"
description = "Intelligent Graph-based Reverse-engineering and Inspection System foundation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Igris contributors" }]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/igris"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["tests/backend"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend/src", "tests/backend"]
exclude = [".venv", ".uv-cache", "frontend/node_modules", "frontend/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S101",
]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "backend/src"
packages = ["igris"]
plugins = ["pydantic.mypy"]
